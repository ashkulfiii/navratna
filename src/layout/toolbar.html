<div class="toolbar" data-toolbar>
  <p class="tb-count" data-count>{{count}}</p>
  <div class="tb-controls">
    <label class="tb-field" for="sort">
      <span>Sort</span>
      <select id="sort" data-sort>
        <option value="featured">Featured</option>
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="price-asc">Price, low to high</option>
        <option value="price-desc">Price, high to low</option>
      </select>
    </label>
    <label class="tb-field" for="color" data-color-wrap hidden>
      <span>Color</span>
      <select id="color" data-color></select>
    </label>
    <div class="views" role="group" aria-label="Layout">
      <button type="button" data-view="gallery" aria-pressed="true" aria-label="Standard view" title="Standard view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="3" width="8" height="18"/><rect x="13" y="3" width="8" height="18"/></svg>
      </button>
      <button type="button" data-view="compact" aria-pressed="false" aria-label="Four in a box" title="Four in a box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/></svg>
      </button>
      <button type="button" data-view="single" aria-pressed="false" aria-label="One at a time" title="One at a time">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="5" y="3" width="14" height="18"/></svg>
      </button>
    </div>
  </div>
</div>
