{{header}}
<main id="main" class="narrow">
  <h1 style="font-size:clamp(2.25rem,6vw,3.75rem);line-height:1.15">Contact</h1>
  <p class="intro" style="margin-top:1.5rem;max-width:36rem;line-height:1.75;color:color-mix(in oklch, var(--foreground) 80%, transparent)">For enquiries about our handmade pieces, our mission of giving back, or simply to say hello. We'd love to hear from you.</p>
  <div class="contact-lines">
    <a href="mailto:{{contact.email}}">{{contact.email}}</a>
    <a href="https://instagram.com/{{contact.instagram}}" target="_blank" rel="noopener">@{{contact.instagram}}</a>
  </div>
</main>
{{footer}}
