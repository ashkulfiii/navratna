{{header}}
<main id="main" class="narrow">
  <h1 style="font-size:clamp(2.25rem,6vw,3.75rem);line-height:1.15">Contact</h1>
  <p class="intro" style="margin-top:1.5rem;max-width:36rem;line-height:1.75;color:color-mix(in oklch, var(--foreground) 80%, transparent)">For enquiries about our handmade pieces, our mission of giving back, or simply to say hello. We'd love to hear from you.</p>
  <ul class="contact-links">
    <li>
      <a href="mailto:{{contact.email}}">
        <span class="contact-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg></span>
        <span class="contact-text"><span class="contact-label">Email</span><span class="contact-value">{{contact.email}}</span></span>
      </a>
    </li>
    <li>
      <a href="https://instagram.com/{{contact.instagram}}" target="_blank" rel="noopener">
        <span class="contact-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h2l1.5-2h4L15.5 6h2A2.5 2.5 0 0 1 20 8.5v9A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
        <span class="contact-text"><span class="contact-label">Instagram</span><span class="contact-value">@{{contact.instagram}}</span></span>
      </a>
    </li>
  </ul>
</main>
{{footer}}
